[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abuse-ring-detector"
version = "1.0.0"
description = "Shadow-only frozen Model F abuse-ring detection service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.100,<1",
  "uvicorn[standard]>=0.22,<1",
  "redis>=5,<6",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "networkx>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "httpx>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
