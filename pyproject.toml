[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abuse-ring-detector"
version = "1.0.0"
description = "Shadow-only frozen Model F abuse-ring detection service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.100,<1",
  "uvicorn[standard]>=0.22,<1",
  "redis>=5,<6",
  "numpy==2.0.2",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "networkx==3.4.2",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
